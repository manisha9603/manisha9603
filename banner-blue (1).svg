<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .name { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 700; letter-spacing: 6px; }
      .role { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 400; letter-spacing: 3px; }
    </style>
  </defs>

  <rect width="1200" height="260" fill="#EAF4FF"/>

  <line x1="0" y1="259" x2="1200" y2="259" stroke="#2E86DE" stroke-width="2"/>

  <g>
    <circle cx="1060" cy="70" r="2.5" fill="#2E86DE">
      <animateMotion dur="14s" repeatCount="indefinite"
        path="M 0,0 A 90,90 0 1,1 -0.1,0" />
    </circle>
    <ellipse cx="1060" cy="70" rx="90" ry="90" fill="none" stroke="#2E86DE" stroke-width="0.6" opacity="0.35"/>

    <circle cx="1060" cy="70" r="1.8" fill="#2E86DE" opacity="0.6">
      <animateMotion dur="9s" repeatCount="indefinite"
        path="M 0,0 A 55,55 0 1,0 0.1,0" />
    </circle>
    <ellipse cx="1060" cy="70" rx="55" ry="55" fill="none" stroke="#2E86DE" stroke-width="0.5" opacity="0.25"/>
  </g>

  <text x="80" y="130" class="name" font-size="54" fill="#1B2A41" opacity="0">
    MANISHA
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="1s" fill="freeze"/>
  </text>

  <rect x="82" y="150" width="0" height="3" fill="#2E86DE">
    <animate attributeName="width" from="0" to="260" begin="1.1s" dur="0.7s" fill="freeze"/>
  </rect>

  <text x="80" y="185" class="role" font-size="16" fill="#4A6178" opacity="0">
    FULL STACK DEVELOPER
    <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.9s" fill="freeze"/>
  </text>

  <text x="80" y="212" class="role" font-size="13" fill="#7B93A8" opacity="0">
    B.TECH COMPUTER SCIENCE — GEETA UNIVERSITY
    <animate attributeName="opacity" from="0" to="1" begin="2s" dur="0.9s" fill="freeze"/>
  </text>
</svg>
